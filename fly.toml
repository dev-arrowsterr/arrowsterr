# The Arrowsterr app on Fly.io (app.arrowsterr.com). arrowsterr.com stays on WordPress at Hostinger.
#   fly deploy
app = "arrowsterr-web"
primary_region = "nrt" # Tokyo, the closest Fly region to the Supabase database in Seoul

[build]
  dockerfile = "Dockerfile"

# Read at build time, so it goes here instead of in the secrets. A Sentry DSN is safe to share. Empty means off.
[build.args]
  NEXT_PUBLIC_SENTRY_DSN = ""

[http_service]
  internal_port = 3000
  force_https = true
  # Always on. The worker calls /api/worker every 20 seconds, so the app would never sleep anyway.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Fly sends traffic to a new deploy only once this answers.
  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
